# How very meta, a TV channel to view all channels on TV

[metadata]
name = "channels"
description = "A channel to view all channels on TV"

[source]
command = "tv list-channels"

[keybindings]
enter = "actions:zap"

[actions.zap]
description = "Zap to the selected channel"
command = "tv '{}'"
mode = "execute"

[preview]
command = "bat -n --color=always ~/.config/television/cable/'{}'.toml"
